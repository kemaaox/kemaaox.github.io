services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kemaaox
    volumes:
      - ./:/usr/src/app
    ports:
      - '4000:4000'
    environment:
      # Outside "development", jekyll serve keeps url: "" from _config_docker.yml,
      # so assets use relative paths and work from localhost and 0.0.0.0 alike.
      - JEKYLL_ENV=docker